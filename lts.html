  button { padding: 10px 18px; border: none; border-radius: 8px; background: #222; color: #fff; font-size: .9rem; cursor: pointer; white-space: nowrap; transition: opacity .15s; }

  .hidden { display: none !important; }

<script type="module">
// ============================================================
// 【配置区】
// ============================================================
const SUPABASE_URL = 'https://qkpkcraxuihcuyxyghvo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wt2MAEObXEjuqXxpiKb0MQ_aP3SRhzs';

// ============================================================
// 精简 Supabase 客户端（内嵌，无外部依赖，带健壮重连）
// ============================================================
class MiniSupabase {
  constructor(url, key) {
    this.url = url.replace(/\/+$/, '');
    this.key = key;
    const m = this.url.match(/^https:\/\/([^.]+)\./);
    this.projectRef = m ? m[1] : null;

    this.channels = new Map();     // topic -> { ch, join }
    this.joinedTopics = new Set(); // 已成功 join 的 topic
    this.ws = null;
    this.wsRef = 0;
    this.heartbeatTimer = null;
    this.reconnectTimer = null;
    this.reconnectAttempts = 0;
    this.connectPromise = null;
    this.lastMessageAt = 0;
    this.manualClose = false;
    this.onConnectedCallbacks = [];

    // 网络恢复 / 页面重新可见时主动检查连接
    window.addEventListener('online', () => this._ensureConnected());
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && this.channels.size > 0) this._ensureConnected();
    });
  }

  // ---------- REST ----------
  _restHeaders() {
    return { 'apikey': this.key, 'Authorization': `Bearer ${this.key}` };
  }

  async select(table, opts = {}) {
    const params = new URLSearchParams();
    params.set('select', '*');
    (opts.filters || []).forEach(([col, op, val]) => params.append(col, `${op}.${val}`));
    if (opts.order) params.set('order', opts.order);
    if (opts.limit) params.set('limit', String(opts.limit));

    const res = await fetch(`${this.url}/rest/v1/${table}?${params}`, {
      headers: this._restHeaders(),
    });
    if (!res.ok) throw new Error(`[${res.status}] ${await res.text()}`);
    return res.json();
  }

  async insert(table, row) {
    const res = await fetch(`${this.url}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        ...this._restHeaders(),
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
      },
      body: JSON.stringify(row),
    });
    if (!res.ok) throw new Error(`[${res.status}] ${await res.text()}`);
    const data = await res.json();
    return (data && data[0]) || null;
  }

  // 带重试的 select（网络抖动时自动重试）
  async selectWithRetry(table, opts, retries = 3) {
    let lastErr;
    for (let i = 0; i < retries; i++) {
      try { return await this.select(table, opts); }
      catch (err) {
        lastErr = err;
        if (i < retries - 1) await new Promise(r => setTimeout(r, 500 * (i + 1)));
      }
    }
    throw lastErr;
  }

  // ---------- Realtime ----------
  onConnected(cb) { this.onConnectedCallbacks.push(cb); }

  channel(topicName) {
    const topic = `realtime:${topicName}`;
    const ch = {
      topic,
      _config: null,
      _handlers: [],
      on(event, filter, handler) {
        if (event === 'postgres_changes') {
          if (!ch._config) {
            ch._config = {
              broadcast: { ack: false, self: false },
              presence: { key: '' },
              postgres_changes: [],
            };
          }
          ch._config.postgres_changes.push({
            event: filter.event || '*',
            schema: filter.schema || 'public',
            table: filter.table,
            ...(filter.filter ? { filter: filter.filter } : {}),
          });
        }
        ch._handlers.push({ event, filter, handler });
        return ch;
      },
      subscribe: () => { this._subscribeChannel(ch); return ch; },
    };
    return ch;
  }

  removeChannel(ch) {
    if (!ch || !ch.topic) return;
    this._send({ topic: ch.topic, event: 'phx_leave', payload: {}, ref: String(++this.wsRef) });
    this.channels.delete(ch.topic);
    this.joinedTopics.delete(ch.topic);
  }

  _subscribeChannel(ch) {
    const joinFn = () => {
      if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
      const payload = {
        config: ch._config || { broadcast: { ack: false, self: false }, presence: { key: '' } },
      };
      if (this.key.startsWith('eyJ')) payload.access_token = this.key;
      const ref = String(++this.wsRef);
      this._send({
        topic: ch.topic, event: 'phx_join',
        payload, ref, join_ref: ref,
      });
    };
    this.channels.set(ch.topic, { ch, join: joinFn });

    // 关键修复：已连接才立即 join，否则等 onopen 统一 join（避免双重 join）
    if (this.ws && this.ws.readyState === WebSocket.OPEN && !this.joinedTopics.has(ch.topic)) {
      joinFn();
    } else {
      this._ensureConnected();
    }
  }

  _ensureConnected() {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) return Promise.resolve();
    if (this.connectPromise) return this.connectPromise;
    return this._connect();
  }

  _connect() {
    if (this.connectPromise) return this.connectPromise;
    if (!this.projectRef) {
      this.connectPromise = Promise.reject(new Error('无法从 SUPABASE_URL 解析 project ref'));
      return this.connectPromise;
    }

    this.connectPromise = new Promise((resolve, reject) => {
      const wsUrl =
        `wss://${this.projectRef}.supabase.co/realtime/v1/websocket` +
        `?apikey=${encodeURIComponent(this.key)}&vsn=1.0.0`;
      let settled = false;
      const ws = new WebSocket(wsUrl);
      this.ws = ws;
      this.manualClose = false;

      const timeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        try { ws.close(); } catch {}
        this.connectPromise = null;
        reject(new Error('WebSocket 连接超时'));
      }, 15000);

      ws.onopen = () => {
        clearTimeout(timeout);
        if (settled) return;
        settled = true;
        this.reconnectAttempts = 0;
        this.lastMessageAt = Date.now();
        this.joinedTopics.clear();
        // 统一在这里 join 所有频道
        this.channels.forEach(({ join }) => join());
        this._startHeartbeat();
        this._notifyConnected();
        resolve();
      };

      ws.onmessage = e => {
        this.lastMessageAt = Date.now();
        this._handleWsMessage(e);
      };

      ws.onerror = () => { /* 交给 onclose 处理 */ };

      ws.onclose = () => {
        clearTimeout(timeout);
        this.connectPromise = null;
        this._stopHeartbeat();
        this.joinedTopics.clear();
        if (!settled) {
          settled = true;
          reject(new Error('WebSocket 连接被关闭'));
        }
        if (!this.manualClose && this.channels.size > 0) {
          this._scheduleReconnect();
        }
      };
    });
    return this.connectPromise;
  }

  _scheduleReconnect() {
    clearTimeout(this.reconnectTimer);
    const delay = Math.min(30000, 1000 * Math.pow(2, this.reconnectAttempts));
    this.reconnectAttempts++;
    console.warn(`[Realtime] ${delay}ms 后尝试第 ${this.reconnectAttempts} 次重连`);
    this.reconnectTimer = setTimeout(() => {
      if (this.channels.size > 0) {
        this._connect().catch(err => console.warn('[Realtime] 重连失败:', err.message));
      }
    }, delay);
  }

  _notifyConnected() {
    this.onConnectedCallbacks.forEach(cb => { try { cb(); } catch (e) { console.error(e); } });
  }

  _send(obj) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify(obj));
    }
  }

  _startHeartbeat() {
    this._stopHeartbeat();
    this.heartbeatTimer = setInterval(() => {
      // 45 秒无任何响应，视为死连接，主动关闭触发重连
      if (Date.now() - this.lastMessageAt > 45000) {
        console.warn('[Realtime] 心跳超时，主动重连');
        try { this.ws.close(); } catch {}
        return;
      }
      this._send({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++this.wsRef) });
    }, 25000);
  }

  _stopHeartbeat() {
    if (this.heartbeatTimer) { clearInterval(this.heartbeatTimer); this.heartbeatTimer = null; }
  }

  _handleWsMessage(e) {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    // 处理 join 的 ack
    if (msg.event === 'phx_reply') {
      const status = msg.payload && msg.payload.status;
      if (status === 'ok') {
        this.joinedTopics.add(msg.topic);
      } else if (status === 'error') {
        console.warn('[Realtime] join 被拒绝:', msg.topic, msg.payload);
        this.joinedTopics.delete(msg.topic);
        const entry = this.channels.get(msg.topic);
        if (entry) setTimeout(() => {
          if (this.ws && this.ws.readyState === WebSocket.OPEN) entry.join();
        }, 3000);
      }
      return;
    }

    if (msg.event === 'phx_error') {
      console.warn('[Realtime] phx_error:', msg);
      return;
    }

    const entry = this.channels.get(msg.topic);
    if (!entry) return;

    if (msg.event === 'postgres_changes') {
      const data = msg.payload && msg.payload.data;
      if (!data) return;
      entry.ch._handlers.forEach(({ event, filter, handler }) => {
        if (event !== 'postgres_changes') return;
        if (filter.event && filter.event !== data.type) return;
        if (filter.schema && filter.schema !== data.schema) return;
        if (filter.table && filter.table !== data.table) return;
        if (filter.filter) {
          const m = filter.filter.match(/^(\w+)=eq\.(.+)$/);
          if (m && String(data.record[m[1]]) !== m[2]) return;
        }
        try { handler({ new: data.record }); }
        catch (err) { console.error('[Realtime] handler 异常:', err); }
      });
    }
  }
}

// ============================================================
// 初始化
// ============================================================
function showFatal(msg) {
  const el = document.getElementById('fatalError');
  if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}
if (SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_')) {
  showFatal('请先在 index.html 中填入 SUPABASE_URL 和 SUPABASE_ANON_KEY。');
  throw new Error('missing config');
}
const supabaseClient = new MiniSupabase(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// 工具
// ============================================================
function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text == null ? '' : String(text);
  return d.innerHTML;
}

function getSenderId() {
  let id = localStorage.getItem('demo_sender_id');
  if (!id) {
    id = (crypto.randomUUID && crypto.randomUUID()) ||
         ('u_' + Math.random().toString(36).slice(2) + Date.now().toString(36));
    localStorage.setItem('demo_sender_id', id);
  }
  return id;
}
const SENDER_ID = getSenderId();

async function deriveRoomHash(password) {
  const dateStr = new Date().toISOString().slice(0, 10);
  const raw = `${password}|${dateStr}`;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 0;
  for (let i = 0; i < raw.length; i++) h = ((h << 5) - h + raw.charCodeAt(i)) | 0;
  return 'h' + (h >>> 0).toString(16).padStart(8, '0');
}

// 用于消息去重（乐观更新 + Realtime 推送可能同一行到达两次）
const renderedKeys = new Set();
function shouldRender(table, row) {
  if (!row || row.id == null) return true;
  const key = `${table}:${row.id}`;
  if (renderedKeys.has(key)) return false;
  renderedKeys.add(key);
  return true;
}

// ============================================================
// TAB 切换
// ============================================================
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === `tab-${btn.dataset.tab}`);
    });
  });
});

// ============================================================
// 留言墙
// ============================================================
const wallMessagesEl = document.getElementById('wallMessages');
const wallInput = document.getElementById('wallInput');
const wallSendBtn = document.getElementById('wallSendBtn');
let wallChannel = null;

function renderWallMessage(container, row) {
  const div = document.createElement('div');
  div.className = 'msg';
  const time = new Date(row.created_at).toLocaleString();
  const left = Math.max(0, Math.round((new Date(row.expires_at) - Date.now()) / 3600000));
  div.innerHTML =
    `<div class="meta">${escapeHtml(time)} · ${escapeHtml(String(row.sender_id).slice(0, 6))}… · 剩余 ${left}h</div>` +
    escapeHtml(row.content);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function loadWall() {
  try {
    const data = await supabaseClient.selectWithRetry('wall_messages', {
      filters: [['expires_at', 'gt', new Date().toISOString()]],
      order: 'created_at.asc',
    });
    // 增量渲染，不整体清空，避免实时消息被冲掉
    (data || []).forEach(row => {
      if (new Date(row.expires_at) > new Date() && shouldRender('wall_messages', row)) {
        renderWallMessage(wallMessagesEl, row);
      }
    });
  } catch (err) {
    showFatal('加载留言墙失败：' + err.message);
  }
}

function subscribeWall() {
  if (wallChannel) supabaseClient.removeChannel(wallChannel);
  wallChannel = supabaseClient
    .channel('wall-feed')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'wall_messages' },
      payload => {
        const row = payload.new;
        if (!row || new Date(row.expires_at) <= new Date()) return;
        if (shouldRender('wall_messages', row)) renderWallMessage(wallMessagesEl, row);
      })
    .subscribe();
}

async function sendWallMessage() {
  const content = wallInput.value.trim();
  if (!content) return;
  wallSendBtn.disabled = true;
  try {
    const inserted = await supabaseClient.insert('wall_messages', {
      content,
      sender_id: SENDER_ID,
      expires_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
    });
    wallInput.value = '';
    // 乐观更新：立即上屏，Realtime 到达时由 shouldRender 去重
    if (inserted && shouldRender('wall_messages', inserted)) {
      renderWallMessage(wallMessagesEl, inserted);
    }
  } catch (err) {
    alert('发送失败：' + err.message);
  } finally {
    wallSendBtn.disabled = false;
  }
}

wallSendBtn.addEventListener('click', sendWallMessage);
wallInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendWallMessage(); });

function setRoomStatus(connected) {

function renderChatMessage(container, row) {
  const div = document.createElement('div');
  div.className = 'msg';
  const time = new Date(row.created_at).toLocaleTimeString();
  const nick = row.nickname || '匿名';
  const genderClass = ['male', 'female', 'other'].includes(row.gender) ? row.gender : '';
  const genderIcon = row.gender === 'male' ? '♂' : row.gender === 'female' ? '♀' : row.gender === 'other' ? '⚲' : '';
  div.innerHTML =
    `<div class="meta">` +
      `<span class="nick ${genderClass}">${escapeHtml(nick)}</span>` +
      (genderIcon ? `<span class="badge ${genderClass}">${genderIcon}</span>` : '') +
      `<span>· ${escapeHtml(time)}</span>` +
    `</div>` +
    escapeHtml(row.content);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function loadRoomHistory() {
  if (!currentRoomHash) return;
  try {
    const data = await supabaseClient.selectWithRetry('chat_messages', {
      filters: [['room_hash', 'eq', currentRoomHash]],
      order: 'created_at.asc',
    });
    (data || []).forEach(row => {
      if (shouldRender('chat_messages', row)) renderChatMessage(roomMessagesEl, row);
    });
  } catch (err) {
    alert('加载历史消息失败：' + err.message);
  }
}

function subscribeRoom() {
  if (roomChannel) supabaseClient.removeChannel(roomChannel);
  roomChannel = supabaseClient
    .channel(`room-${currentRoomHash}`)
    .on('postgres_changes',
      {
        event: 'INSERT', schema: 'public', table: 'chat_messages',
        filter: `room_hash=eq.${currentRoomHash}`,
      },
      payload => {
        const row = payload.new;
        if (!row) return;
        if (shouldRender('chat_messages', row)) renderChatMessage(roomMessagesEl, row);
      })
    .subscribe();
}

async function enterRoom() {
  const pwd = roomPassword.value.trim();
  const nick = roomNickname.value.trim();
  const gender = roomGender.value;

  if (!pwd) { alert('请输入口令'); return; }
  if (!nick) { alert('请输入昵称'); roomNickname.focus(); return; }
  if (!gender) { alert('请选择性别'); roomGender.focus(); return; }

  localStorage.setItem('demo_nickname', nick);
  localStorage.setItem('demo_gender', gender);

  roomEnterBtn.disabled = true;
  try {
    currentRoomHash = await deriveRoomHash(pwd);
    currentNickname = nick;
    currentGender = gender;

    roomMessagesEl.innerHTML = '';
    roomLogin.classList.add('hidden');
    roomChat.classList.remove('hidden');

    await loadRoomHistory();

    const dateStr = new Date().toISOString().slice(0, 10);
    roomInfo.textContent = `${currentNickname} · 频道 ${currentRoomHash.slice(0, 8)}… · ${dateStr}`;
    setRoomStatus(false);

    subscribeRoom();
  } catch (err) {
    alert('进入失败：' + err.message);
    currentRoomHash = null;
  } finally {
    roomEnterBtn.disabled = false;
  }
}

function leaveRoom() {
  if (roomChannel) { supabaseClient.removeChannel(roomChannel); roomChannel = null; }
  currentRoomHash = null;
  currentNickname = null;
  currentGender = null;
  roomChat.classList.add('hidden');
  roomLogin.classList.remove('hidden');
  roomPassword.value = '';
  roomMessagesEl.innerHTML = '';
}

async function sendRoomMessage() {
  const content = roomInput.value.trim();
  if (!content || !currentRoomHash) return;
  roomSendBtn.disabled = true;
  try {
    const inserted = await supabaseClient.insert('chat_messages', {
      content,
      sender_id: SENDER_ID,
      room_hash: currentRoomHash,
      nickname: currentNickname,
      gender: currentGender,
    });
    roomInput.value = '';
    if (inserted && shouldRender('chat_messages', inserted)) {
      renderChatMessage(roomMessagesEl, inserted);
    }
  } catch (err) {
    alert('发送失败：' + err.message);
  } finally {
    roomSendBtn.disabled = false;
  }
}

roomEnterBtn.addEventListener('click', enterRoom);
roomPassword.addEventListener('keydown', e => { if (e.key === 'Enter') enterRoom(); });
roomLeaveBtn.addEventListener('click', leaveRoom);
roomSendBtn.addEventListener('click', sendRoomMessage);
roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendRoomMessage(); });

// ============================================================
// WebSocket 重连成功后：补一次数据，避免断线期间漏消息
// ============================================================
supabaseClient.onConnected(() => {
  setRoomStatus(true);
  loadWall();
  if (currentRoomHash) loadRoomHistory();
});

// ============================================================
// 启动
// ============================================================
loadWall();
subscribeWall();
</script>
</body>
</html>
