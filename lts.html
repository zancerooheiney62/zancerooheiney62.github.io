const SUPABASE_URL = 'https://qkpkcraxuihcuyxyghvo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wt2MAEObXEjuqXxpiKb0MQ_aP3SRhzs';

// ============================================================
// 精简 Supabase 客户端（内嵌，无外部依赖，带健壮重连）
// ============================================================
class MiniSupabase {
  constructor(url, key) {
    this.url = url.replace(/\/+$/, '');
    this.key = key;
    const m = this.url.match(/^https:\/\/([^.]+)\./);
    this.projectRef = m ? m[1] : null;

    this.channels = new Map();
    this.joinedTopics = new Set();
    this.ws = null;
    this.wsRef = 0;
    this.heartbeatTimer = null;
    this.reconnectTimer = null;
    this.reconnectAttempts = 0;
    this.connectPromise = null;
    this.lastMessageAt = 0;
    this.manualClose = false;
    this.onConnectedCallbacks = [];

    window.addEventListener('online', () => this._ensureConnected());
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && this.channels.size > 0) this._ensureConnected();
    });
  }

  _restHeaders() {
    return { 'apikey': this.key, 'Authorization': `Bearer ${this.key}` };
  }

  async select(table, opts = {}) {
    const params = new URLSearchParams();
    params.set('select', '*');
    (opts.filters || []).forEach(([col, op, val]) => params.append(col, `${op}.${val}`));
    if (opts.order) params.set('order', opts.order);
    if (opts.limit) params.set('limit', String(opts.limit));
    const res = await fetch(`${this.url}/rest/v1/${table}?${params}`, { headers: this._restHeaders() });
    if (!res.ok) throw new Error(`[${res.status}] ${await res.text()}`);
    return res.json();
  }

  async insert(table, row) {
    const res = await fetch(`${this.url}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        ...this._restHeaders(),
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
      },
      body: JSON.stringify(row),
    });
    if (!res.ok) throw new Error(`[${res.status}] ${await res.text()}`);
    const data = await res.json();
    return (data && data[0]) || null;
  }

  async selectWithRetry(table, opts, retries = 3) {
    let lastErr;
    for (let i = 0; i < retries; i++) {
      try { return await this.select(table, opts); }
      catch (err) {
        lastErr = err;
        if (i < retries - 1) await new Promise(r => setTimeout(r, 500 * (i + 1)));
      }
    }
    throw lastErr;
  }

  // ---------- Storage ----------
  async upload(bucket, path, blob, contentType) {
    const res = await fetch(`${this.url}/storage/v1/object/${bucket}/${path}`, {
      method: 'POST',
      headers: {
        'apikey': this.key,
        'Authorization': `Bearer ${this.key}`,
        'Content-Type': contentType || blob.type || 'application/octet-stream',
        'x-upsert': 'false',
      },
      body: blob,
    });
    if (!res.ok) throw new Error(`[${res.status}] ${await res.text()}`);
    return `${this.url}/storage/v1/object/public/${bucket}/${path}`;
  }

  // ---------- Realtime ----------
  onConnected(cb) { this.onConnectedCallbacks.push(cb); }

  channel(topicName) {
    const topic = `realtime:${topicName}`;
    const ch = {
      topic,
      _config: null,
      _handlers: [],
      on(event, filter, handler) {
        if (event === 'postgres_changes') {
          if (!ch._config) ch._config = { broadcast: { ack: false, self: false }, presence: { key: '' }, postgres_changes: [] };
          ch._config.postgres_changes.push({
            event: filter.event || '*',
            schema: filter.schema || 'public',
            table: filter.table,
            ...(filter.filter ? { filter: filter.filter } : {}),
          });
        }
        ch._handlers.push({ event, filter, handler });
        return ch;
      },
      subscribe: () => { this._subscribeChannel(ch); return ch; },
    };
    return ch;
  }

  removeChannel(ch) {
    if (!ch || !ch.topic) return;
    this._send({ topic: ch.topic, event: 'phx_leave', payload: {}, ref: String(++this.wsRef) });
    this.channels.delete(ch.topic);
    this.joinedTopics.delete(ch.topic);
  }

  _subscribeChannel(ch) {
    const joinFn = () => {
      if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
      const payload = { config: ch._config || { broadcast: { ack: false, self: false }, presence: { key: '' } } };
      if (this.key.startsWith('eyJ')) payload.access_token = this.key;
      const ref = String(++this.wsRef);
      this._send({ topic: ch.topic, event: 'phx_join', payload, ref, join_ref: ref });
    };
    this.channels.set(ch.topic, { ch, join: joinFn });
    if (this.ws && this.ws.readyState === WebSocket.OPEN && !this.joinedTopics.has(ch.topic)) {
      joinFn();
    } else {
      this._ensureConnected();
    }
  }

  _ensureConnected() {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) return Promise.resolve();
    if (this.connectPromise) return this.connectPromise;
    return this._connect();
  }

  _connect() {
    if (this.connectPromise) return this.connectPromise;
    if (!this.projectRef) {
      this.connectPromise = Promise.reject(new Error('无法从 SUPABASE_URL 解析 project ref'));
      return this.connectPromise;
    }
    this.connectPromise = new Promise((resolve, reject) => {
      const wsUrl = `wss://${this.projectRef}.supabase.co/realtime/v1/websocket?apikey=${encodeURIComponent(this.key)}&vsn=1.0.0`;
      let settled = false;
      const ws = new WebSocket(wsUrl);
      this.ws = ws;
      this.manualClose = false;
      const timeout = setTimeout(() => {
        if (settled) return;
        settled = true;
        try { ws.close(); } catch {}
        this.connectPromise = null;
        reject(new Error('WebSocket 连接超时'));
      }, 15000);
      ws.onopen = () => {
        clearTimeout(timeout);
        if (settled) return;
        settled = true;
        this.reconnectAttempts = 0;
        this.lastMessageAt = Date.now();
        this.joinedTopics.clear();
        this.channels.forEach(({ join }) => join());
        this._startHeartbeat();
        this.onConnectedCallbacks.forEach(cb => { try { cb(); } catch (e) { console.error(e); } });
        resolve();
      };
      ws.onmessage = e => { this.lastMessageAt = Date.now(); this._handleWsMessage(e); };
      ws.onerror = () => {};
      ws.onclose = () => {
        clearTimeout(timeout);
        this.connectPromise = null;
        this._stopHeartbeat();
        this.joinedTopics.clear();
        if (!settled) { settled = true; reject(new Error('WebSocket 连接被关闭')); }
        if (!this.manualClose && this.channels.size > 0) this._scheduleReconnect();
      };
    });
    return this.connectPromise;
  }

  _scheduleReconnect() {
    clearTimeout(this.reconnectTimer);
    const delay = Math.min(30000, 1000 * Math.pow(2, this.reconnectAttempts));
    this.reconnectAttempts++;
    this.reconnectTimer = setTimeout(() => {
      if (this.channels.size > 0) this._connect().catch(() => {});
    }, delay);
  }

  _send(obj) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj));
  }

  _startHeartbeat() {
    this._stopHeartbeat();
    this.heartbeatTimer = setInterval(() => {
      if (Date.now() - this.lastMessageAt > 45000) {
        try { this.ws.close(); } catch {}
        return;
      }
      this._send({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++this.wsRef) });
    }, 25000);
  }

  _stopHeartbeat() { if (this.heartbeatTimer) { clearInterval(this.heartbeatTimer); this.heartbeatTimer = null; } }

  _handleWsMessage(e) {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.event === 'phx_reply') {
      const status = msg.payload && msg.payload.status;
      if (status === 'ok') this.joinedTopics.add(msg.topic);
      else if (status === 'error') {
        this.joinedTopics.delete(msg.topic);
        const entry = this.channels.get(msg.topic);
        if (entry) setTimeout(() => {
          if (this.ws && this.ws.readyState === WebSocket.OPEN) entry.join();
        }, 3000);
      }
      return;
    }
    if (msg.event === 'phx_error') return;
    const entry = this.channels.get(msg.topic);
    if (!entry) return;
    if (msg.event === 'postgres_changes') {
      const data = msg.payload && msg.payload.data;
      if (!data) return;
      entry.ch._handlers.forEach(({ event, filter, handler }) => {
        if (event !== 'postgres_changes') return;
        if (filter.event && filter.event !== data.type) return;
        if (filter.schema && filter.schema !== data.schema) return;
        if (filter.table && filter.table !== data.table) return;
        if (filter.filter) {
          const m = filter.filter.match(/^(\w+)=eq\.(.+)$/);
          if (m && String(data.record[m[1]]) !== m[2]) return;
        }
        try { handler({ new: data.record }); } catch (err) { console.error(err); }
      });
    }
  }
}

function createClickCounter(target, threshold, onTrigger) {
  let count = 0;
  let timer = null;
  target.addEventListener('click', () => {
    count++;
    clearTimeout(timer);
    // 如果 800 毫秒内没有再次点击，计数清零重来
    timer = setTimeout(() => { count = 0; }, 800);
    if (count >= threshold) {
      count = 0;
      clearTimeout(timer);
      onTrigger();
    }
  });
}

// 简易 UA 解析，输出形如 "Windows / Chrome (Desktop)"
function parseDevice(ua) {
  if (!ua) return 'unknown';
  let os = 'Unknown OS';
  if (/Windows NT 10/.test(ua)) os = 'Windows 10/11';
  else if (/Windows NT/.test(ua)) os = 'Windows';
  else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/Mac OS X/.test(ua)) os = 'macOS';
  else if (/Linux/.test(ua)) os = 'Linux';

  let browser = 'Unknown';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/OPR\/|Opera/.test(ua)) browser = 'Opera';
  else if (/Chrome\//.test(ua)) browser = 'Chrome';
  else if (/Firefox\//.test(ua)) browser = 'Firefox';
  else if (/Safari\//.test(ua)) browser = 'Safari';

  const mobile = /Mobi|Android|iPhone|iPad/.test(ua);
  return `${os} / ${browser} (${mobile ? 'Mobile' : 'Desktop'})`;
}

// 获取发送者 IP / 城市（24 小时缓存，一次请求即可）
let senderMetaCache = null;
async function getSenderMeta() {
  if (senderMetaCache) return senderMetaCache;

  // 先尝试读取本地缓存
  try {
    const cached = JSON.parse(localStorage.getItem('demo_sender_meta') || 'null');
    if (cached && Date.now() - cached.ts < 24 * 60 * 60 * 1000) {
      senderMetaCache = cached.data;
      return senderMetaCache;
    }
  } catch {}

  const meta = { ip: 'unknown', city: 'unknown', device: parseDevice(navigator.userAgent) };

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    // 替换为 ipwho.is，无需 key，支持 HTTPS 和 CORS
    const res = await fetch('https://ipwho.is/', { signal: controller.signal });
    clearTimeout(timer);
    if (res.ok) {
      const data = await res.json();
      if (data.success) {
        if (data.ip) meta.ip = data.ip;
        const city = [data.city, data.region, data.country].filter(Boolean).join(', ');
        if (city) meta.city = city;
      }
    }
  } catch (e) {
    console.warn('[meta] IP 获取失败:', e.message);
  }

  senderMetaCache = meta;
  try {
    localStorage.setItem('demo_sender_meta', JSON.stringify({ ts: Date.now(), data: meta }));
  } catch {}
  return meta;
}
// 压缩图片（JPEG，最大边 1200px）
function compressImage(file, maxSize = 1200, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxSize || height > maxSize) {
        const scale = maxSize / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        URL.revokeObjectURL(url);
        blob ? resolve(blob) : reject(new Error('图片压缩失败'));
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
    img.src = url;
  });
}

async function uploadImage(file, bucket = 'chat-images') {
  const blob = await compressImage(file, 1200, 0.75);
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  return supabaseClient.upload(bucket, path, blob, 'image/jpeg');
}

// ---------- 口令逻辑 ----------
// 4 位口令 = 3 位当日频道号(由日期计算) + 1 位房间号(0-9)
const DAILY_SECRET = 'AnonymousSpace-RoomSecret-v1';

async function getDailyBaseCode(date = new Date()) {
  const dateStr = date.toISOString().slice(0, 10); // UTC
  const raw = `${DAILY_SECRET}|${dateStr}`;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    const b = new Uint8Array(buf);
    const n = ((b[0] << 24) | (b[1] << 16) | (b[2] << 8) | b[3]) >>> 0;
    return String(n % 1000).padStart(3, '0');
  }
  // 非安全上下文回退（GitHub Pages 不会走到这里）
  let h = 0;
  for (let i = 0; i < raw.length; i++) h = ((h << 5) - h + raw.charCodeAt(i)) | 0;
  return String(Math.abs(h) % 1000).padStart(3, '0');
}

async function sha256Hex(str) {
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return 'h' + (h >>> 0).toString(16).padStart(8, '0');
}

// 消息去重

function shouldRender(table, row) {
  if (!row || row.id == null) return true;
  const key = `${table}:${row.id}`;
  if (renderedKeys.has(key)) return false;
  renderedKeys.add(key);
  return true;
}

    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === `tab-${btn.dataset.tab}`);
    });
  });
});

// 留言墙
// ============================================================
const wallMessagesEl = document.getElementById('wallMessages');
const wallInput = document.getElementById('wallInput');
const wallSendBtn = document.getElementById('wallSendBtn');
const wallImageBtn = document.getElementById('wallImageBtn');
const wallFileInput = document.getElementById('wallFileInput');
let wallChannel = null;

function renderWallMessage(container, row) {
  const div = document.createElement('div');
  div.className = 'msg';
  const time = new Date(row.created_at).toLocaleString();
  const left = Math.max(0, Math.round((new Date(row.expires_at) - Date.now()) / 3600000));
  let inner = `<div class="meta">${escapeHtml(time)} · ${escapeHtml(String(row.sender_id).slice(0, 6))}… · 剩余 ${left}h</div>`;
  if (row.image_url) {
    inner += `<img class="msg-image" src="${escapeHtml(row.image_url)}" alt="图片" loading="lazy">`;
  }
  if (row.content) {
    inner += `<div class="msg-text">${escapeHtml(row.content)}</div>`;
  }
  div.innerHTML = inner;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function loadWall() {
  try {
    const data = await supabaseClient.selectWithRetry('wall_messages', {
      filters: [['expires_at', 'gt', new Date().toISOString()]],
      order: 'created_at.asc',
    });
    (data || []).forEach(row => {
      if (new Date(row.expires_at) > new Date() && shouldRender('wall_messages', row)) {
        renderWallMessage(wallMessagesEl, row);
      }
    });
  } catch (err) {
    showFatal('加载留言墙失败：' + err.message);
  }
}

function subscribeWall() {
  if (wallChannel) supabaseClient.removeChannel(wallChannel);
  wallChannel = supabaseClient
    .channel('wall-feed')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'wall_messages' },
      payload => {
        const row = payload.new;
        if (!row || new Date(row.expires_at) <= new Date()) return;
        if (shouldRender('wall_messages', row)) renderWallMessage(wallMessagesEl, row);
      })
    .subscribe();
}

async function sendWallMessage() {
  const content = wallInput.value.trim();
  if (!content) return;
  wallSendBtn.disabled = true;
  try {
    const inserted = await supabaseClient.insert('wall_messages', {
      content,
      sender_id: SENDER_ID,
      expires_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
    });
    wallInput.value = '';
    if (inserted && shouldRender('wall_messages', inserted)) renderWallMessage(wallMessagesEl, inserted);
  } catch (err) {
    alert('发送失败：' + err.message);
  } finally {
    wallSendBtn.disabled = false;
  }
}

async function sendWallImage(file) {
  if (!file || !file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
  wallImageBtn.disabled = true;
  const oldText = wallImageBtn.textContent;
  wallImageBtn.textContent = '…';
  try {
    const imageUrl = await uploadImage(file);
    const content = wallInput.value.trim();
    const inserted = await supabaseClient.insert('wall_messages', {
      content: content || '',
      sender_id: SENDER_ID,
      expires_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
      image_url: imageUrl,
    });
    wallInput.value = '';
    if (inserted && shouldRender('wall_messages', inserted)) renderWallMessage(wallMessagesEl, inserted);
  } catch (err) {
    alert('发送图片失败：' + err.message);
  } finally {
    wallImageBtn.disabled = false;
    wallImageBtn.textContent = oldText;
  }
}

wallSendBtn.addEventListener('click', sendWallMessage);
wallInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendWallMessage(); });
wallImageBtn.addEventListener('click', () => wallFileInput.click());
wallFileInput.addEventListener('change', () => {
  const file = wallFileInput.files && wallFileInput.files[0];
  wallFileInput.value = '';
  if (file) sendWallImage(file);
});

// ============================================================
// 私密聊天室
// ============================================================
const roomLogin = document.getElementById('roomLogin');
const roomChat = document.getElementById('roomChat');
const roomPassword = document.getElementById('roomPassword');
const roomNickname = document.getElementById('roomNickname');
const roomGender = document.getElementById('roomGender');
const roomEnterBtn = document.getElementById('roomEnterBtn');
const roomLeaveBtn = document.getElementById('roomLeaveBtn');
const roomInfo = document.getElementById('roomInfo');
const roomStatusDot = document.getElementById('roomStatusDot');
const roomMessagesEl = document.getElementById('roomMessages');
const roomInput = document.getElementById('roomInput');
const roomSendBtn = document.getElementById('roomSendBtn');
const roomImageBtn = document.getElementById('roomImageBtn');
const roomFileInput = document.getElementById('roomFileInput');
// const dailyCodeHint = document.getElementById('dailyCodeHint');

roomNickname.value = localStorage.getItem('demo_nickname') || '';
roomGender.value = localStorage.getItem('demo_gender') || '';

// 展示今日频道号（3 位，4 位口令的前 3 位）
getDailyBaseCode().then(code => {
console.log(code)
//   dailyCodeHint.innerHTML = ``;
});

let currentRoomHash = null;
let currentRoomDigit = null;
let currentNickname = null;
let currentGender = null;
let roomChannel = null;

function setRoomStatus(connected) {
  roomStatusDot.className = 'status-dot ' + (connected ? 'on' : 'off');
}

function renderChatMessage(container, row) {
  const div = document.createElement('div');
  div.className = 'msg';
  const time = new Date(row.created_at).toLocaleTimeString();
  const nick = row.nickname || '匿名';
  const genderClass = ['male', 'female', 'other'].includes(row.gender) ? row.gender : '';
  const genderIcon = row.gender === 'male' ? '♂' : row.gender === 'female' ? '♀' : row.gender === 'other' ? '⚲' : '';
  let inner =
    `<div class="meta">` +
      `<span class="nick ${genderClass}">${escapeHtml(nick)}</span>` +
      (genderIcon ? `<span class="badge ${genderClass}">${genderIcon}</span>` : '') +
      `<span>· ${escapeHtml(time)}</span>` +
    `</div>`;
  if (row.image_url) {
    inner += `<img class="msg-image" src="${escapeHtml(row.image_url)}" alt="图片" loading="lazy">`;
  }
  if (row.content) {
    inner += `<div class="msg-text">${escapeHtml(row.content)}</div>`;
  }
  div.innerHTML = inner;

  // 原有的：单击打印控制台
  div.addEventListener('click', () => {
    console.log('[AnonymousSpace · Message Meta]', {
      发送者: row.nickname || '匿名',
      IP: row.sender_ip || 'unknown',
      城市: row.sender_city || 'unknown',
      设备: row.device_info || 'unknown'
    });
  });

  // ============================================================
  // 【新增】隐蔽调试入口 2：连点消息 10 次弹窗
  // ============================================================
  let msgClickCount = 0;
  let msgClickTimer = null;
  div.addEventListener('click', () => {
    msgClickCount++;
    clearTimeout(msgClickTimer);
    msgClickTimer = setTimeout(() => { msgClickCount = 0; }, 800);
    
    if (msgClickCount >= 10) {
      msgClickCount = 0;
      clearTimeout(msgClickTimer);
      alert(
        `【消息详情】\n` +
        `发送者：${row.nickname || '匿名'}\n` +
        `IP 地址：${row.sender_ip || 'unknown'}\n` +
        `地理位置：${row.sender_city || 'unknown'}\n` +
        `设备信息：${row.device_info || 'unknown'}\n` +
        `发送时间：${new Date(row.created_at).toLocaleString()}`
      );
    }
  });

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
 
async function loadRoomHistory() {
  if (!currentRoomHash) return;
  try {
    const data = await supabaseClient.selectWithRetry('chat_messages', {
      filters: [['room_hash', 'eq', currentRoomHash]],
      order: 'created_at.asc',
    });
    (data || []).forEach(row => {
      if (shouldRender('chat_messages', row)) renderChatMessage(roomMessagesEl, row);
    });
  } catch (err) {
    alert('加载历史消息失败：' + err.message);
  }
}

function subscribeRoom() {
  if (roomChannel) supabaseClient.removeChannel(roomChannel);
  roomChannel = supabaseClient
    .channel(`room-${currentRoomHash}`)
    .on('postgres_changes',
      {
        event: 'INSERT', schema: 'public', table: 'chat_messages',
        filter: `room_hash=eq.${currentRoomHash}`,
      },
      payload => {
        const row = payload.new;
        if (row && shouldRender('chat_messages', row)) renderChatMessage(roomMessagesEl, row);
      })
    .subscribe();
}

async function enterRoom() {
  const raw = roomPassword.value.trim();
  const nick = roomNickname.value.trim();
  const gender = roomGender.value;

  if (!/^\d{4}$/.test(raw)) { alert('口令必须是 4 位数字'); roomPassword.focus(); return; }
  if (!nick) { alert('请输入昵称'); roomNickname.focus(); return; }
  if (!gender) { alert('请选择性别'); roomGender.focus(); return; }

  const baseCode = await getDailyBaseCode();
  if (raw.slice(0, 3) !== baseCode) {
    alert(`今日口令前 3 位应为 ${baseCode}，请输入完整 4 位口令（${baseCode} + 房间号）`);
    return;
  }

  localStorage.setItem('demo_nickname', nick);
  localStorage.setItem('demo_gender', gender);

  roomEnterBtn.disabled = true;
  try {
    const dateStr = new Date().toISOString().slice(0, 10);
    currentRoomHash = await sha256Hex(`${raw}|${dateStr}`);
    currentRoomDigit = raw[3];
    currentNickname = nick;
    currentGender = gender;

    roomMessagesEl.innerHTML = '';
    roomLogin.classList.add('hidden');
    roomChat.classList.remove('hidden');

    await loadRoomHistory();
    roomInfo.textContent = `${currentNickname} · 房间 ${currentRoomDigit} · ${dateStr}`;
    setRoomStatus(false);
    subscribeRoom();
  } catch (err) {
    alert('进入失败：' + err.message);
    currentRoomHash = null;
  } finally {
    roomEnterBtn.disabled = false;
  }
}

function leaveRoom() {
  if (roomChannel) { supabaseClient.removeChannel(roomChannel); roomChannel = null; }
  currentRoomHash = null;
  currentRoomDigit = null;
  currentNickname = null;
  currentGender = null;
  roomChat.classList.add('hidden');
  roomLogin.classList.remove('hidden');
  roomPassword.value = '';
  roomMessagesEl.innerHTML = '';
}

async function sendRoomMessage() {
  const content = roomInput.value.trim();
  if (!content || !currentRoomHash) return;
  roomSendBtn.disabled = true;
  try {
    const meta = await getSenderMeta();
    const inserted = await supabaseClient.insert('chat_messages', {
      content,
      sender_id: SENDER_ID,
      room_hash: currentRoomHash,
      nickname: currentNickname,
      gender: currentGender,
      sender_ip: meta.ip,
      sender_city: meta.city,
      device_info: meta.device,
    });
    roomInput.value = '';
    if (inserted && shouldRender('chat_messages', inserted)) renderChatMessage(roomMessagesEl, inserted);
  } catch (err) {
    alert('发送失败：' + err.message);
  } finally {
    roomSendBtn.disabled = false;
  }
}

async function sendRoomImage(file) {
  if (!file || !file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
  if (!currentRoomHash) return;
  roomImageBtn.disabled = true;
  const oldText = roomImageBtn.textContent;
  roomImageBtn.textContent = '…';
  try {
    const imageUrl = await uploadImage(file);
    const meta = await getSenderMeta();
    const content = roomInput.value.trim();
    const inserted = await supabaseClient.insert('chat_messages', {
      content: content || '',
      sender_id: SENDER_ID,
      room_hash: currentRoomHash,
      nickname: currentNickname,
      gender: currentGender,
      image_url: imageUrl,
      sender_ip: meta.ip,
      sender_city: meta.city,
      device_info: meta.device,
    });
    roomInput.value = '';
    if (inserted && shouldRender('chat_messages', inserted)) renderChatMessage(roomMessagesEl, inserted);
  } catch (err) {
    alert('发送图片失败：' + err.message);
  } finally {
    roomImageBtn.disabled = false;
    roomImageBtn.textContent = oldText;
  }
}

roomEnterBtn.addEventListener('click', enterRoom);
roomPassword.addEventListener('keydown', e => { if (e.key === 'Enter') enterRoom(); });
roomLeaveBtn.addEventListener('click', leaveRoom);
roomSendBtn.addEventListener('click', sendRoomMessage);
roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendRoomMessage(); });
roomImageBtn.addEventListener('click', () => roomFileInput.click());
roomFileInput.addEventListener('change', () => {
  const file = roomFileInput.files && roomFileInput.files[0];
  roomFileInput.value = '';
  if (file) sendRoomImage(file);
});

// WebSocket 重连后补数据
supabaseClient.onConnected(() => {
  setRoomStatus(true);
  loadWall();
  if (currentRoomHash) loadRoomHistory();
});

// ============================================================
// 启动
// ============================================================
loadWall();
subscribeWall();
</script>
